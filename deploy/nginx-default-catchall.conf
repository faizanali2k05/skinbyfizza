# Catch-all for hostnames that match no other vhost.
#
# Without this, nginx silently falls back to the FIRST loaded server block for
# a port. On this box that meant any unconfigured host on :443 landed on
# agent-crm and redirected to portal.agentcrm.5kassi.com/login. A request for an
# unknown hostname should die here, not get routed into an unrelated app.
#
# Installed at /etc/nginx/sites-enabled/000-default-catchall (the 000- prefix
# guarantees it loads first).

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    # Self-signed on purpose: an unknown host should fail the TLS handshake
    # rather than be served someone else's site under a valid certificate.
    ssl_certificate     /etc/ssl/certs/catchall.crt;
    ssl_certificate_key /etc/ssl/private/catchall.key;

    return 444;
}
