# Serves the built SPA inside the container. The host's nginx terminates TLS
# and proxies here; this block only needs routing + caching.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed assets are immutable; index.html must never be cached or users get
    # a stale shell pointing at deleted asset hashes after a redeploy.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback — every client route resolves to the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
